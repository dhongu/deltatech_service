coverage:
  status:
    project:
      default:
        target: 50% # the required coverage value
        threshold: 10% # the leniency in hitting the target
    patch:
      default:
        target: 10%
        threshold: 10% # the leniency in hitting the target

ignore:
  - "**/tests/**"

# One flag per CI shard: a shard that fails or skips the upload keeps its last
# coverage instead of dropping its addons from the report.
flag_management:
  default_rules:
    carryforward: true
